<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Diwali! 🪔</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        overflow: hidden;
        background: linear-gradient(
          to bottom,
          #0a0e27 0%,
          #1a1447 50%,
          #2d1b4e 100%
        );
        font-family: "Georgia", serif;
      }

      #info {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: #ffd700;
        text-align: center;
        z-index: 100;
        text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
        pointer-events: none;
      }

      #info h1 {
        font-size: 3em;
        margin-bottom: 10px;
        animation: glow 2s ease-in-out infinite;
      }

      #info p {
        font-size: 1.2em;
        color: #ffb347;
      }

      @keyframes glow {
        0%,
        100% {
          text-shadow:
            0 0 20px rgba(255, 215, 0, 0.8),
            0 0 40px rgba(255, 140, 0, 0.6);
        }
        50% {
          text-shadow:
            0 0 30px rgba(255, 215, 0, 1),
            0 0 60px rgba(255, 140, 0, 0.8);
        }
      }

      #controls {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-size: 0.9em;
        text-align: center;
        z-index: 100;
        background: rgba(0, 0, 0, 0.5);
        padding: 15px 30px;
        border-radius: 10px;
        backdrop-filter: blur(10px);
      }
    </style>
  </head>
  <body>
    <div id="info">
      <h1>✨ शुभ दीपावली ✨</h1>
      <p>Happy Diwali!</p>
    </div>

    <div id="controls">Click anywhere to launch fireworks! 🎆</div>

    <script>
      let fireworks = [];
      let particles = [];
      let diyas = [];

      class Diya {
        constructor(x, y) {
          this.x = x;
          this.y = y;
          this.flicker = 0;
        }

        show() {
          // Diya flame with flicker effect
          this.flicker = noise(frameCount * 0.1 + this.x) * 5;

          // Diya base
          fill(180, 90, 30);
          noStroke();
          ellipse(this.x, this.y, 30, 15);

          // Flame glow
          for (let i = 3; i > 0; i--) {
            fill(255, 150, 0, 30);
            ellipse(this.x, this.y - 15 + this.flicker, 20 * i, 25 * i);
          }

          // Flame
          fill(255, 200, 0);
          beginShape();
          vertex(this.x, this.y - 10 + this.flicker);
          bezierVertex(
            this.x - 5,
            this.y - 20 + this.flicker,
            this.x - 3,
            this.y - 30 + this.flicker,
            this.x,
            this.y - 35 + this.flicker,
          );
          bezierVertex(
            this.x + 3,
            this.y - 30 + this.flicker,
            this.x + 5,
            this.y - 20 + this.flicker,
            this.x,
            this.y - 10 + this.flicker,
          );
          endShape(CLOSE);

          // Inner flame
          fill(255, 255, 150);
          ellipse(this.x, this.y - 20 + this.flicker, 8, 12);
        }
      }

      class Firework {
        constructor(x, y) {
          this.x = x;
          this.y = height;
          this.targetY = y;
          this.speed = random(8, 12);
          this.exploded = false;
          this.hue = random(360);
        }

        update() {
          if (!this.exploded) {
            this.y -= this.speed;
            if (this.y <= this.targetY) {
              this.explode();
              this.exploded = true;
            }
          }
        }

        explode() {
          let colors = [
            [255, 50, 50], // red
            [255, 200, 50], // gold
            [50, 255, 50], // green
            [50, 150, 255], // blue
            [255, 100, 255], // pink
            [255, 150, 50], // orange
          ];

          let particleColor = random(colors);
          let particleCount = random(80, 150);

          for (let i = 0; i < particleCount; i++) {
            let angle = random(TWO_PI);
            let speed = random(2, 8);
            particles.push(
              new Particle(this.x, this.y, angle, speed, particleColor),
            );
          }
        }

        show() {
          if (!this.exploded) {
            strokeWeight(4);
            stroke(this.hue, 255, 255);
            point(this.x, this.y);

            // Trail
            for (let i = 0; i < 5; i++) {
              stroke(this.hue, 255, 255, 100 - i * 20);
              point(this.x + random(-2, 2), this.y + i * 5);
            }
          }
        }
      }

      class Particle {
        constructor(x, y, angle, speed, col) {
          this.x = x;
          this.y = y;
          this.vx = cos(angle) * speed;
          this.vy = sin(angle) * speed;
          this.alpha = 255;
          this.size = random(2, 6);
          this.color = col;
          this.gravity = 0.1;
        }

        update() {
          this.vx *= 0.98;
          this.vy *= 0.98;
          this.vy += this.gravity;
          this.x += this.vx;
          this.y += this.vy;
          this.alpha -= 4;
        }

        show() {
          noStroke();
          fill(this.color[0], this.color[1], this.color[2], this.alpha);
          ellipse(this.x, this.y, this.size);

          // Sparkle effect
          if (random(1) > 0.95) {
            stroke(255, 255, 255, this.alpha);
            strokeWeight(1);
            line(this.x - 3, this.y, this.x + 3, this.y);
            line(this.x, this.y - 3, this.x, this.y + 3);
          }
        }

        isDead() {
          return this.alpha <= 0;
        }
      }

      function setup() {
        createCanvas(windowWidth, windowHeight);
        colorMode(RGB);

        // Create diyas along the bottom
        for (let i = 100; i < width - 100; i += 150) {
          diyas.push(new Diya(i, height - 50));
        }

        // Auto-launch some fireworks
        setInterval(() => {
          if (random(1) > 0.3) {
            fireworks.push(
              new Firework(
                random(width * 0.2, width * 0.8),
                random(height * 0.2, height * 0.5),
              ),
            );
          }
        }, 800);
      }

      function draw() {
        // Night sky with slight fade for trails
        fill(10, 14, 39, 40);
        noStroke();
        rect(0, 0, width, height);

        // Stars
        for (let i = 0; i < 100; i++) {
          let starX = noise(i * 100) * width;
          let starY = noise(i * 200) * height * 0.7;
          let twinkle = noise(frameCount * 0.01 + i) * 255;
          stroke(255, 255, 255, twinkle);
          strokeWeight(random(1, 2));
          point(starX, starY);
        }

        // Update and show fireworks
        for (let i = fireworks.length - 1; i >= 0; i--) {
          fireworks[i].update();
          fireworks[i].show();
          if (fireworks[i].exploded) {
            fireworks.splice(i, 1);
          }
        }

        // Update and show particles
        for (let i = particles.length - 1; i >= 0; i--) {
          particles[i].update();
          particles[i].show();
          if (particles[i].isDead()) {
            particles.splice(i, 1);
          }
        }

        // Show diyas
        for (let diya of diyas) {
          diya.show();
        }
      }

      function mousePressed() {
        // Launch firework at mouse position
        fireworks.push(
          new Firework(mouseX, random(height * 0.2, height * 0.5)),
        );
      }

      function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
        diyas = [];
        for (let i = 100; i < width - 100; i += 150) {
          diyas.push(new Diya(i, height - 50));
        }
      }
    </script>
  </body>
</html>
